name: Docker CI/CD Pipeline

on:
  push:
    tags:
      - 'qa/morent-api/*'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/qa/morent-api/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Image
      - name: Build Docker Image
        if: startsWith(github.ref, 'refs/tags/qa/morent-api/')
        run: |
          docker build -t morent-api:latest .
          docker run -d morent-api:latest

      - name: Push Docker Image to Docker Hub
        if: startsWith(github.ref, 'refs/tags/qa/morent-api/')
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/morent-api:${{ github.sha }}

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy MorentAPI to server
        if: startsWith(github.ref, 'refs/tags/qa/morent-api/')
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/morent-api:${{ github.sha }}
            sudo docker stop morent-api || true
            sudo docker rm morent-api || true
            sudo docker run -d --name morent-api --network="host" -p 6996:6996 ${{ secrets.DOCKERHUB_USERNAME }}/morent-api:${{ github.sha }}